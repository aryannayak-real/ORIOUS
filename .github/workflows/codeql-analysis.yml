name: codeql
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '25 16 * * 2'
jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    if: github.event_name != 'schedule' || github.repository == 'aryannayak-real/ORIOUS'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Exclude paths
      # The importers are excluded from analysis, because some of the apps
      # can import from don't have such great crypto, which will cause false
      # positive security alerts.
      run: |
        find app/src/main/java/app/orious/authenticator/importers ! \( -name AegisImporter.java -o -name "DatabaseImporter*" \) -type f -exec rm -f {} +
        sed -i '/Importer.class/d' app/src/main/java/app/orious/authenticator/importers/DatabaseImporter.java
    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java-kotlin
    - name: Build
      run: |
        chmod +x gradlew
        if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
          tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
        fi
        ./gradlew assembleDebug --no-daemon
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:java-kotlin"
