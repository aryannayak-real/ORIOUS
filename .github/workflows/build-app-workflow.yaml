name: build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@699bb18358f12c5b78b37bb0111d3a0e2276e0e2

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Prepare release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ORIOUS_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orious-release.jks"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ORIOUS_STORE_FILE: ${{ runner.temp }}/orious-release.jks
          ORIOUS_STORE_PASSWORD: ${{ secrets.ORIOUS_STORE_PASSWORD }}
          ORIOUS_KEY_ALIAS: ${{ secrets.ORIOUS_KEY_ALIAS }}
          ORIOUS_KEY_PASSWORD: ${{ secrets.ORIOUS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ORIOUS Authenticator ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/app-release.apk
