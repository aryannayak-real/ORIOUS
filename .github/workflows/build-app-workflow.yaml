name: build

on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@699bb18358f12c5b78b37bb0111d3a0e2276e0e2

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build the app
        run: ./gradlew assembleDebug testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release keystore
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.ORIOUS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orious-release.jks"

      - name: Build signed release APK
        if: github.event_name == 'push'
        env:
          ORIOUS_STORE_FILE: ${{ runner.temp }}/orious-release.jks
          ORIOUS_STORE_PASSWORD: ${{ secrets.ORIOUS_STORE_PASSWORD }}
          ORIOUS_KEY_ALIAS: ${{ secrets.ORIOUS_KEY_ALIAS }}
          ORIOUS_KEY_PASSWORD: ${{ secrets.ORIOUS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: orious-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
