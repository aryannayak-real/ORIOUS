name: build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Gradle wrapper and debug keystore
        run: |
          chmod +x gradlew
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
          fi

      - name: Run unit tests, lint, and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Prepare release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ORIOUS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ORIOUS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORIOUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ORIOUS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Missing one or more release signing secrets (ORIOUS_KEYSTORE_BASE64, ORIOUS_STORE_PASSWORD, ORIOUS_KEY_ALIAS, ORIOUS_KEY_PASSWORD)." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/orious-release.jks"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ORIOUS_STORE_FILE: ${{ runner.temp }}/orious-release.jks
          ORIOUS_STORE_PASSWORD: ${{ secrets.ORIOUS_STORE_PASSWORD }}
          ORIOUS_KEY_ALIAS: ${{ secrets.ORIOUS_KEY_ALIAS }}
          ORIOUS_KEY_PASSWORD: ${{ secrets.ORIOUS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ORIOUS Authenticator ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/app-release.apk
